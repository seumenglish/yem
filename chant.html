<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YEM 챈트 타임</title><link rel="stylesheet" href="assets/font/cafe24.css">
<style>
:root{--plum:#50202F;--blue:#4E7FD0;--pink:#EC4F8B;--cream:#FFF8EE}
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--cream);color:var(--plum);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.stage{border-radius:22px;padding:20px 18px 24px;color:#fff;background:radial-gradient(ellipse at 18% -10%,rgba(255,226,122,.7),transparent 45%),linear-gradient(160deg,#2B2766,#5A3C9E 55%,#B04F9E);position:relative;overflow:hidden}
.stage .lt{font-weight:800;letter-spacing:2px;font-size:12px;color:#FFE27A} .stage h1{font-size:24px;margin-top:6px} .stage p{font-size:13px;margin-top:4px;opacity:.9}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#FFE27A 0 10px,#ec4f8b 10px 20px,#7FD3FF 20px 30px,#8CC152 30px 40px)}
.tabs{display:flex;gap:8px;margin:14px 0 8px;flex-wrap:wrap} .tabs button{border:0;border-radius:99px;padding:9px 14px;font-weight:800;background:#fff;color:var(--plum);box-shadow:0 2px 0 rgba(0,0,0,.08)} .tabs button.on{background:var(--pink);color:#fff}
audio{width:100%;margin:6px 0 4px}
.note{font-size:12px;color:#7d5566;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.c,.r{border-radius:14px;padding:10px 12px;font-weight:800} .c{background:#fff;border:2px solid var(--plum);color:#2F5CA8} .r{background:#FFE27A}
.mv{background:#fff;border:2px solid var(--plum);border-radius:14px;padding:10px 12px;margin:6px 0} .mv b{color:#D9734E}
.sol{display:flex;flex-wrap:wrap;gap:2px 10px;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0} .sol span{display:inline-flex;flex-direction:column;align-items:center} .sol i{font-style:normal;font-size:11px;color:#7B4FC9} .sol b{font-size:17px}
h2{font-size:16px;margin:16px 0 4px;color:#D9734E}
.empty{text-align:center;padding:60px 20px}
a.home{display:inline-block;margin-top:18px;color:var(--blue);font-weight:800;text-decoration:none}
</style></head><body><div class="wrap" id="app"></div>
